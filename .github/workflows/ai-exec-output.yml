name: Native AI exec output

on:
  push:
    branches: [feat/ai-tool-calling]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SSH command execution
        shell: python
        run: |
          from pathlib import Path

          p = Path('internal/app/service.go')
          text = p.read_text()
          old = '\tSendInput(string, string) error\n'
          if 'ExecCommand(string, string) (string, error)' not in text:
              text = text.replace(old, old + '\tExecCommand(string, string) (string, error)\n', 1)
          old = '''func (s *Service) executeSessionCommand(sessionID, command string) error {\n\tsessionID = strings.TrimSpace(sessionID)\n\tcommand = strings.TrimSpace(command)\n\tif sessionID == "" {\n\t\treturn fmt.Errorf("command request session id is required")\n\t}\n\tif command == "" {\n\t\treturn fmt.Errorf("command cannot be empty")\n\t}\n\ttab, ok := s.runtimeTab(sessionID)\n\tif !ok {\n\t\treturn fmt.Errorf("active session %q not found", sessionID)\n\t}\n\tif tab.ProtocolID != "ssh" {\n\t\treturn fmt.Errorf("commands can only run in ssh sessions")\n\t}\n\tif s.sshManager == nil {\n\t\treturn fmt.Errorf("ssh manager is not configured")\n\t}\n\treturn s.sshManager.SendInput(sessionID, command+"\\n")\n}\n'''
          new = '''func (s *Service) executeSessionCommand(sessionID, command string) (string, error) {\n\tsessionID = strings.TrimSpace(sessionID)\n\tcommand = strings.TrimSpace(command)\n\tif sessionID == "" {\n\t\treturn "", fmt.Errorf("command request session id is required")\n\t}\n\tif command == "" {\n\t\treturn "", fmt.Errorf("command cannot be empty")\n\t}\n\ttab, ok := s.runtimeTab(sessionID)\n\tif !ok {\n\t\treturn "", fmt.Errorf("active session %q not found", sessionID)\n\t}\n\tif tab.ProtocolID != "ssh" {\n\t\treturn "", fmt.Errorf("commands can only run in ssh sessions")\n\t}\n\tif s.sshManager == nil {\n\t\treturn "", fmt.Errorf("ssh manager is not configured")\n\t}\n\treturn s.sshManager.ExecCommand(sessionID, command)\n}\n'''
          if old not in text:
              raise SystemExit('executeSessionCommand block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('internal/ssh/manager.go')
          text = p.read_text()
          old = '''func (m *Manager) SendInput(tabID, data string) error {\n'''
          method = '''func (m *Manager) ExecCommand(tabID, command string) (string, error) {\n\tm.mu.RLock()\n\tconn := m.connections[tabID]\n\tm.mu.RUnlock()\n\tif conn == nil {\n\t\treturn "", fmt.Errorf("ssh tab %q is not connected", tabID)\n\t}\n\tcommand = strings.TrimSpace(command)\n\tif command == "" {\n\t\treturn "", fmt.Errorf("command cannot be empty")\n\t}\n\tsession, err := conn.client.NewSession()\n\tif err != nil {\n\t\treturn "", fmt.Errorf("create ssh exec session: %w", err)\n\t}\n\tdefer session.Close()\n\toutput, err := session.CombinedOutput(command)\n\tresult := string(output)\n\tconst maxToolOutput = 32768\n\tif len(result) > maxToolOutput {\n\t\tresult = result[:maxToolOutput] + "\\n[output truncated by Eiksy]"\n\t}\n\tif err != nil {\n\t\treturn result, fmt.Errorf("run command over ssh: %w", err)\n\t}\n\treturn result, nil\n}\n\n'''
          if 'func (m *Manager) ExecCommand(' not in text:
              text = text.replace(old, method + old, 1)
          p.write_text(text)

          p = Path('internal/app/service_test.go')
          text = p.read_text()
          old = 'func (m *recordingSSHManager) SendInput(tabID, data string) error { m.inputs = append(m.inputs, sshInputCall{tabID: tabID, payload: data}); return m.sendInputErr }\n'
          new = old + 'func (m *recordingSSHManager) ExecCommand(tabID, command string) (string, error) { m.inputs = append(m.inputs, sshInputCall{tabID: tabID, payload: command + "\\n"}); return "mock output", m.sendInputErr }\n'
          if 'func (m *recordingSSHManager) ExecCommand(' not in text:
              if old not in text:
                  raise SystemExit('recording SSH manager block not found')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('internal/app/native_tool_calling.go')
          text = p.read_text()
          text = text.replace('''\t\tif err := s.executeSessionCommand(args.SessionID, args.Command); err != nil {\n\t\t\treturn fmt.Sprintf(`{"error":"command execution failed","message":%q}`, err.Error()), false, nil\n\t\t}\n\t\treturn fmt.Sprintf(`{"ok":true,"sessionId":%q,"command":%q}`, args.SessionID, args.Command), false, nil\n''', '''\t\toutput, err := s.executeSessionCommand(args.SessionID, args.Command)\n\t\tif err != nil {\n\t\t\treturn fmt.Sprintf(`{"error":"command execution failed","message":%q,"output":%q}`, err.Error(), output), false, nil\n\t\t}\n\t\treturn fmt.Sprintf(`{"ok":true,"sessionId":%q,"command":%q,"output":%q}`, args.SessionID, args.Command, output), false, nil\n''')
          text = text.replace('''\t\tif err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q}`, err.Error()))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q}`, request.SessionID, request.Command))\n''', '''\t\toutput, err := s.executeSessionCommand(request.SessionID, request.Command)\n\t\tif err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q,"output":%q}`, err.Error(), output))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q,"output":%q}`, request.SessionID, request.Command, output))\n''')
          p.write_text(text)

          p = Path('internal/app/service.go')
          text = p.read_text()
          text = text.replace('''\tif err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {\n\t\tmessage = fmt.Sprintf("Command execution failed: %v", err)\n\t} else {\n''', '''\tif _, err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {\n\t\tmessage = fmt.Sprintf("Command execution failed: %v", err)\n\t} else {\n''')
          p.write_text(text)
      - name: Format and test
        run: |
          gofmt -w internal/app/service.go internal/app/native_tool_calling.go internal/app/service_test.go internal/ssh/manager.go
          go test ./...
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go internal/app/native_tool_calling.go internal/app/service_test.go internal/ssh/manager.go
          git rm .github/workflows/ai-exec-output.yml
          git commit -m 'feat(ai): return SSH command output to tool calls'
          git push
