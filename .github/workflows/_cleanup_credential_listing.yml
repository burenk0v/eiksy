name: Temporary credential listing cleanup

on:
  push:
    branches:
      - security/narrow-credential-path-capability

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete Vault listing code and tests
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path("internal/app/service.go")
          text = service.read_text()
          text, service_count = re.subn(
              r'\nfunc \(s \*Service\) ListVaultSecrets(?:ForProvider)?\b.*?(?=\nfunc \(s \*Service\) renewVaultToken)',
              '\n', text, flags=re.S)
          if service_count != 1:
              raise SystemExit(f"expected exactly one legacy Vault listing block, found {service_count}")
          service.write_text(text)

          tests = Path("internal/app/service_test.go")
          text = tests.read_text()
          text, test_count = re.subn(
              r'\nfunc TestListVaultSecrets(?:RenewsTokenWhenEnabled|ContinuesWhenRenewalFails|UsesLoginPasswordAuthMethod)\(t \*testing\.T\) \{.*?(?=\nfunc TestClearChatKeepsMessageSliceUsable)',
              '\n', text, flags=re.S)
          if test_count != 1:
              raise SystemExit(f"expected exactly one obsolete Vault listing test block, found {test_count}")
          tests.write_text(text)

          service_text = service.read_text()
          service_text = service_text.replace('\n\tvaultdomain "eiksy/internal/domain/vault"', '')
          service_text = service_text.replace('\n\t"github.com/tobischo/gokeepasslib/v3"', '')
          service.write_text(service_text)

      - name: Format
        run: |
          gofmt -w internal/app/service.go internal/app/service_test.go internal/app/credential_path_capability.go internal/app/credential_path_validation.go

      - name: Verify
        run: go test ./...

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/_cleanup_credential_listing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/service.go internal/app/service_test.go internal/app/credential_path_capability.go internal/app/credential_path_validation.go .github/workflows/_cleanup_credential_listing.yml
          git commit -m "security: remove obsolete Vault listing tests"
          git push
