name: Temporary credential listing cleanup

on:
  push:
    branches:
      - security/narrow-credential-path-capability

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete credential listing code and tests
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path("internal/app/service.go")
          text = service.read_text()
          pattern = re.compile(
              r'\nfunc \(s \*Service\) ListVaultSecrets\(path string\) \(\[\]vaultdomain\.SecretNode, error\) \{.*?\n\nfunc \(s \*Service\) renewVaultToken',
              re.S,
          )
          updated, count = pattern.subn('\nfunc (s *Service) renewVaultToken', text)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy Vault/KeePass listing block, found {count}")
          service.write_text(updated)

          tests = Path("internal/app/service_test.go")
          text = tests.read_text()
          pattern = re.compile(
              r'\nfunc TestListVaultSecretsRenewsTokenWhenEnabled\(t \*testing\.T\) \{.*?\nfunc TestClearChatKeepsMessageSliceUsable',
              re.S,
          )
          updated, count = pattern.subn('\nfunc TestClearChatKeepsMessageSliceUsable', text)
          if count != 1:
              raise SystemExit(f"expected exactly one obsolete Vault listing test block, found {count}")
          tests.write_text(updated)

      - name: Remove now-unused imports
        shell: python
        run: |
          from pathlib import Path
          p = Path("internal/app/service.go")
          text = p.read_text()
          text = text.replace('\n\tvaultdomain "eiksy/internal/domain/vault"', '')
          text = text.replace('\n\t"github.com/tobischo/gokeepasslib/v3"', '')
          p.write_text(text)

      - name: Format
        run: |
          gofmt -w internal/app/service.go internal/app/service_test.go internal/app/credential_path_capability.go internal/app/credential_path_validation.go

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/service.go internal/app/service_test.go
          git commit -m "test: remove obsolete Vault listing tests"
          git push
