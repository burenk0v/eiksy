name: Bootstrap storage security hardening

on:
  push:
    branches:
      - security/storage-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/storage-hardening
          fetch-depth: 0

      - name: Apply hardening changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("internal/storage/disk/store.go", 'if err := os.MkdirAll(filepath.Join(baseDir, "models"), 0o755); err != nil {', 'if err := os.MkdirAll(filepath.Join(baseDir, "models"), 0o700); err != nil {')
          replace("internal/storage/disk/store.go", '\tif err := os.MkdirAll(filepath.Join(baseDir, "models"), 0o700); err != nil {\n\t\treturn nil, fmt.Errorf("create eiksy directory: %w", err)\n\t}\n', '\tif err := os.MkdirAll(filepath.Join(baseDir, "models"), 0o700); err != nil {\n\t\treturn nil, fmt.Errorf("create eiksy directory: %w", err)\n\t}\n\tif err := os.Chmod(baseDir, 0o700); err != nil {\n\t\treturn nil, fmt.Errorf("secure eiksy directory permissions: %w", err)\n\t}\n')
          replace("internal/storage/disk/store.go", '\tif err != nil {\n\t\treturn nil, err\n\t}\n\n\tstore := &Store{', '\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif err := os.Chmod(filepath.Join(baseDir, "secrets.db"), 0o600); err != nil {\n\t\treturn nil, fmt.Errorf("secure secrets database permissions: %w", err)\n\t}\n\n\tstore := &Store{')
          replace("internal/storage/disk/store.go", '''\tif err := json.Unmarshal(content, &profiles); err != nil {\n\t\tif renameErr := os.Rename(s.sessionsPath, s.sessionsPath+".fail"); renameErr != nil {\n\t\t\treturn fmt.Errorf("decode sessions file: %w (also failed to rename: %v)", err, renameErr)\n\t\t}\n\t\tif writeErr := os.WriteFile(s.sessionsPath, []byte("[]\\n"), 0o600); writeErr != nil {\n\t\t\treturn fmt.Errorf("decode sessions file: %w (also failed to recreate: %v)", err, writeErr)\n\t\t}\n\t\treturn nil\n\t}''', '''\tif err := json.Unmarshal(content, &profiles); err != nil {\n\t\treturn fmt.Errorf("decode sessions file: %w", err)\n\t}''')
          replace("internal/storage/disk/store.go", '''\tif err := json.Unmarshal(content, &persisted); err != nil {\n\t\tif renameErr := os.Rename(s.settingsPath, s.settingsPath+".fail"); renameErr != nil {\n\t\t\treturn fmt.Errorf("decode settings file: %w (also failed to rename: %v)", err)\n\t\t}\n\t\ts.settings = defaultSettings()\n\t\ts.aiState = defaultAIState()\n\t\treturn s.saveSettings()\n\t}''', '''\tif err := json.Unmarshal(content, &persisted); err != nil {\n\t\treturn fmt.Errorf("decode settings file: %w", err)\n\t}''')
          replace("internal/storage/disk/store.go", '''\tif _, err := os.Stat(path); err == nil {\n\t\treturn nil\n\t} else if !os.IsNotExist(err) {\n\t\treturn err\n\t}\n\treturn os.WriteFile(path, defaultContent, 0o600)''', '''\tif _, err := os.Stat(path); err == nil {\n\t\treturn os.Chmod(path, 0o600)\n\t} else if !os.IsNotExist(err) {\n\t\treturn err\n\t}\n\treturn os.WriteFile(path, defaultContent, 0o600)''')

          replace("internal/securestorage/manager.go", '"sync"\n', '"sync"\n\t"time"\n')
          replace("internal/securestorage/manager.go", '\tkeyringUser string\n\tmasterKey   []byte\n', '\tkeyringUser  string\n\tmasterKey    []byte\n\tautoLockTimer *time.Timer\n')
          replace("internal/securestorage/manager.go", '\tmasterKeySize      = 32\n\tsaltSize           = 16\n', '\tmasterKeySize      = 32\n\tsaltSize           = 16\n\tautoLockDuration   = 15 * time.Minute\n')
          replace("internal/securestorage/manager.go", '''func (m *Manager) Close() error {\n\tif m == nil || m.db == nil {\n\t\treturn nil\n\t}\n\treturn m.db.Close()\n}\n''', '''func (m *Manager) Close() error {\n\tif m == nil {\n\t\treturn nil\n\t}\n\tm.Lock()\n\tif m.db == nil {\n\t\treturn nil\n\t}\n\treturn m.db.Close()\n}\n''')
          replace("internal/securestorage/manager.go", '\t\tm.setMasterKey(masterKey)\n\t\treturn nil\n\tcase errors.Is(err, keyring.ErrNotFound):', '\t\tm.setMasterKey(masterKey)\n\t\tm.touchAutoLock()\n\t\treturn nil\n\tcase errors.Is(err, keyring.ErrNotFound):')
          replace("internal/securestorage/manager.go", '\t\tm.setMasterKey(masterKey)\n\t\treturn nil\n\tdefault:', '\t\tm.setMasterKey(masterKey)\n\t\tm.touchAutoLock()\n\t\treturn nil\n\tdefault:')
          replace("internal/securestorage/manager.go", '''\tmasterKey := append([]byte(nil), m.masterKey...)\n\tif len(masterKey) != masterKeySize {\n\t\treturn nil, ErrMasterPasswordRequired\n\t}\n\treturn masterKey, nil\n}\n\nfunc (m *Manager) setMasterKey(masterKey []byte) {''', '''\tmasterKey := append([]byte(nil), m.masterKey...)\n\tif len(masterKey) != masterKeySize {\n\t\treturn nil, ErrMasterPasswordRequired\n\t}\n\tm.touchAutoLock()\n\treturn masterKey, nil\n}\n\nfunc (m *Manager) Lock() {\n\tif m == nil {\n\t\treturn\n\t}\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tm.zeroizeMasterKeyLocked()\n\tif m.autoLockTimer != nil {\n\t\tm.autoLockTimer.Stop()\n\t\tm.autoLockTimer = nil\n\t}\n}\n\nfunc (m *Manager) touchAutoLock() {\n\tif m == nil {\n\t\treturn\n\t}\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tif len(m.masterKey) != masterKeySize {\n\t\treturn\n\t}\n\tif m.autoLockTimer != nil {\n\t\tm.autoLockTimer.Stop()\n\t}\n\tm.autoLockTimer = time.AfterFunc(autoLockDuration, m.Lock)\n}\n\nfunc (m *Manager) zeroizeMasterKeyLocked() {\n\tfor i := range m.masterKey {\n\t\tm.masterKey[i] = 0\n\t}\n\tm.masterKey = nil\n}\n\nfunc (m *Manager) setMasterKey(masterKey []byte) {''')
          replace("internal/storage/disk/store.go", 'func (s *Store) SecureStorageStatus() securestorage.Status {', 'func (s *Store) LockSecureStorage() {\n\tif s.secretManager != nil {\n\t\ts.secretManager.Lock()\n\t}\n}\n\nfunc (s *Store) SecureStorageStatus() securestorage.Status {')
          replace("internal/storage/memory/store.go", 'func (s *Store) SecureStorageStatus() securestorage.Status {', 'func (s *Store) LockSecureStorage() {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.secureStatus.Unlocked = false\n}\n\nfunc (s *Store) SecureStorageStatus() securestorage.Status {')
          replace("internal/app/service.go", '\tEnsureMasterPassword(string) error\n', '\tEnsureMasterPassword(string) error\n\tLockSecureStorage()\n')
          replace("internal/app/service.go", 'func (s *Service) EmitLog(level, message string) {\n\ttimestamp := time.Now().UTC().Format(time.RFC3339)', 'func (s *Service) EmitLog(level, message string) {\n\tmessage = redactSensitiveLogText(message)\n\ttimestamp := time.Now().UTC().Format(time.RFC3339)')
          replace("internal/app/service.go", 'func (s *Service) GetShellState() ShellState {', 'func (s *Service) LockSecureStorage() {\n\ts.store.LockSecureStorage()\n\ts.emitFn("secure-storage:status", map[string]bool{"unlocked": false})\n}\n\nfunc (s *Service) GetShellState() ShellState {')
          p = Path('internal/app/service.go')
          text = p.read_text()
          text += '''\n\nfunc redactSensitiveLogText(message string) string {\n\tpatterns := []string{"password=", "passwd=", "passphrase=", "token=", "authorization=", "bearer ", "vault_token=", "keepass_password="}\n\tlower := strings.ToLower(message)\n\tfor _, pattern := range patterns {\n\t\tif index := strings.Index(lower, pattern); index >= 0 {\n\t\t\trest := message[index+len(pattern):]\n\t\t\tend := strings.IndexAny(rest, " \\t\\r\\n,;)}]")\n\t\t\tif end < 0 { end = len(rest) }\n\t\t\tmessage = message[:index+len(pattern)] + "[REDACTED]" + rest[end:]\n\t\t\tlower = strings.ToLower(message)\n\t\t}\n\t}\n\treturn message\n}\n'''
          p.write_text(text)
          replace("app.go", '''func (a *App) EnsureMasterPassword(password string) error {\n\treturn a.currentService().EnsureMasterPassword(password)\n}\n''', '''func (a *App) EnsureMasterPassword(password string) error {\n\treturn a.currentService().EnsureMasterPassword(password)\n}\n\nfunc (a *App) LockSecureStorage() {\n\ta.currentService().LockSecureStorage()\n}\n''')
          Path('.security-hardening-applied').write_text('security/storage-hardening\n')

      - name: Format and test
        run: |
          gofmt -w internal/storage/disk/store.go internal/storage/memory/store.go internal/securestorage/manager.go internal/app/service.go app.go
          go test ./...

      - name: Commit hardened implementation and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-hardening-bootstrap.yml
          git add internal/storage/disk/store.go internal/storage/memory/store.go internal/securestorage/manager.go internal/app/service.go app.go .security-hardening-applied
          git commit -m "security: harden local secret storage"
          git push origin security/storage-hardening
