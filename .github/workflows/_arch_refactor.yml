name: architecture-refactor

on:
  push:
    branches:
      - refactor/architecture-hard-cutover

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Split Service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('internal/app/service.go')
          text = src.read_text()
          m = re.search(r'(?ms)^func \\(s \\*Service\\) ', text)
          if not m:
              raise SystemExit('no Service methods found')
          prefix = text[:m.start()]
          rest = text[m.start():]

          methods=[]
          for match in re.finditer(r'(?m)^func \\(s \\*Service\\) [^{]+\\{', rest):
              start=match.start(); brace=rest.find('{', match.start()); depth=0; end=None
              for i in range(brace, len(rest)):
                  if rest[i]=='{': depth+=1
                  elif rest[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              if end is None: raise SystemExit('unbalanced method')
              methods.append(rest[start:end])

          # Keep all non-method top-level declarations in service.go.
          kept = re.sub(r'(?ms)^func \\(s \\*Service\\) [^{]+\\{.*?^\\}', '', rest)
          # The regex above is deliberately not used for writing because nested braces make it unsafe.
          # Reconstruct service.go from prefix plus declarations found outside method spans.
          spans=[]
          for method in methods:
              pos=rest.find(method)
              spans.append((pos,pos+len(method)))
          pieces=[]; cursor=0
          for a,b in sorted(spans):
              pieces.append(rest[cursor:a]); cursor=b
          pieces.append(rest[cursor:])
          declarations=''.join(pieces)
          src.write_text(prefix + declarations)

          buckets={
            'sessions.go': ('Session','Shell','Profile','Launch','CloseSession','normalizeProfile','validateProfile','nextProfileID'),
            'ssh.go': ('SSH','AcceptHostKey'),
            'sftp.go': ('SFTP',),
            'rdp.go': ('RDP',),
            'ai.go': ('AI','Chat','Provider','Model','Native','Cloud','Vault','KeePass'),
            'audit.go': ('Audit','CommandPolicy'),
            'settings.go': ('Settings','Credential'),
            'workspace.go': ('Workspace','RuntimeTab'),
          }
          out={k:[] for k in buckets}
          out['misc.go']=[]
          for method in methods:
              name=re.search(r'func \\(s \\*Service\\) (\\w+)', method).group(1)
              target='misc.go'
              for file,prefixes in buckets.items():
                  if any(name.startswith(p) or name==p for p in prefixes):
                      target=file; break
              out[target].append(method)

          import_block=re.search(r'(?ms)^import \\((.*?)^\\)', prefix)
          if not import_block: raise SystemExit('import block not found')
          imports='import ('+import_block.group(1)+')\n\n'
          for file, ms in out.items():
              if not ms: continue
              p=Path('internal/app')/file
              existing=p.read_text() if p.exists() else 'package app\n\n'
              # New split files contain only moved methods; goimports will calculate imports.
              body='package app\n\n'+imports+'\n'.join(ms)+'\n'
              p.write_text(body)
          PY
          go install golang.org/x/tools/cmd/goimports@latest
          "$(go env GOPATH)/bin/goimports" -w internal/app/*.go
          gofmt -w internal/app/*.go
      - name: Verify
        run: go test ./...
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app
          git commit -m 'refactor: split application service by capability' || true
          git push
      - name: Remove helper workflow
        if: success()
        run: |
          git rm .github/workflows/_arch_refactor.yml
          git commit -m 'chore: remove one-shot architecture refactor workflow'
          git push
