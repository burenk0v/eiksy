name: Build desktop binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG_PREFIX: refs/tags/

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: opsy-linux-amd64
            artifact_name: opsy-linux-amd64
            artifact_path: build/bin/opsy-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            output_name: opsy-windows-amd64.exe
            artifact_name: opsy-windows-amd64
            artifact_path: build/bin/opsy-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        shell: bash
        run: echo "WAILS_VERSION=$(tr -d '\r\n' < .github/wails-cli-version)" >> "$GITHUB_ENV"

      - name: Resolve release version metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Add Go bin directory to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=60
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X main.releaseVersion=${RELEASE_VERSION}" -o ${{ matrix.output_name }}

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.releaseVersion=${RELEASE_VERSION}" -o ${{ matrix.output_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  upload-release-assets:
    name: Upload release ${{ matrix.platform }}
    if: startsWith(github.ref, env.RELEASE_TAG_PREFIX)
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            output_name: opsy-linux-amd64
            artifact_name: opsy-linux-amd64
          - platform: windows/amd64
            output_name: opsy-windows-amd64.exe
            artifact_name: opsy-windows-amd64
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ matrix.artifact_name }}
          path: build/bin

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "build/bin/${{ matrix.output_name }}#${{ matrix.output_name }}" --repo "$GITHUB_REPOSITORY" --clobber
