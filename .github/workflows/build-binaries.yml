name: Build desktop binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG_PREFIX: refs/tags/

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        if: startsWith(github.ref, env.RELEASE_TAG_PREFIX)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: opsy-linux-amd64
            artifact_name: opsy-linux-amd64
            artifact_path: build/bin/opsy-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            output_name: opsy-windows-amd64.exe
            artifact_name: opsy-windows-amd64
            artifact_path: build/bin/opsy-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve Wails CLI version
        shell: bash
        run: echo "WAILS_VERSION=$(tr -d '\r\n' < .github/wails-cli-version)" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Add Go bin directory to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=60
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -o ${{ matrix.output_name }}

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -o ${{ matrix.output_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, env.RELEASE_TAG_PREFIX)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact_path }}#${{ matrix.output_name }}" --repo "$GITHUB_REPOSITORY" --clobber
