name: Go tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply native SSH approval output patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/app/service.go')
          text = p.read_text()
          old = '''\t\tif err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q}`, err.Error()))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q}`, request.SessionID, request.Command))'''
          new = '''\t\toutput, err := s.executeSessionCommandWithOutput(request.SessionID, request.Command)\n\t\tif err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q,"output":%q}`, err.Error(), output))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q,"output":%q}`, request.SessionID, request.Command, output))'''
          if old not in text:
              raise SystemExit('native approval execution block not found')
          p.write_text(text.replace(old, new, 1))
      - name: Format and test
        run: |
          gofmt -w internal/app/service.go internal/app/native_tool_calling.go internal/ssh/exec.go internal/app/ssh_command_output.go internal/app/ssh_command_output_test.go
          go test ./...
      - name: Persist source fix and restore CI workflow
        if: github.event_name == 'pull_request' && github.actor == 'burenk0v'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/test.yml
          git add internal/app/service.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): return SSH output after approval'
          git push
