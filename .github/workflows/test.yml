name: Go tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Clean duplicate AI SSH output patch
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('internal/app/service.go')
          text = p.read_text()
          text = text.replace('\tmaxAICommandOutput     = 32 * 1024\n', '', 1)
          pattern = r'\nfunc \(s \*Service\) executeSessionCommandWithOutput\(sessionID, command string\) \(string, error\) \{.*?\n\}\n\nfunc vaultPathJoin'
          text, count = re.subn(pattern, '\nfunc vaultPathJoin', text, count=1, flags=re.S)
          if count == 0 and 'func (s *Service) executeSessionCommandWithOutput(' in text:
              raise SystemExit('duplicate executeSessionCommandWithOutput block was not located')
          p.write_text(text)
      - name: Format and test
        run: |
          gofmt -w internal/app/service.go internal/app/native_tool_calling.go internal/ssh/exec.go internal/app/ssh_command_output.go internal/app/ssh_command_output_test.go
          go test ./...
      - name: Persist cleanup and restore CI workflow
        if: github.event_name == 'pull_request' && github.actor == 'burenk0v'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/test.yml
          git add internal/app/service.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): use shared SSH output executor after approval'
          git push
