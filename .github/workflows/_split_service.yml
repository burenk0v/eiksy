name: split-service

on:
  push:
    branches:
      - refactor/architecture-hard-cutover

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Split Service with Go AST
        run: |
          cat > /tmp/split_service.go <<'GO'
          package main
          import (
            "fmt"
            "go/ast"
            "go/parser"
            "go/token"
            "os"
            "path/filepath"
            "sort"
            "strings"
          )
          func main() {
            filename := "internal/app/service.go"
            src, err := os.ReadFile(filename); if err != nil { panic(err) }
            fset := token.NewFileSet()
            f, err := parser.ParseFile(fset, filename, src, parser.ParseComments); if err != nil { panic(err) }
            type method struct { name, text string; start, end int }
            var methods []method
            for _, decl := range f.Decls {
              fn, ok := decl.(*ast.FuncDecl); if !ok || fn.Recv == nil || len(fn.Recv.List) == 0 { continue }
              recv := fn.Recv.List[0].Type
              star, ok := recv.(*ast.StarExpr); if !ok { continue }
              ident, ok := star.X.(*ast.Ident); if !ok || ident.Name != "Service" { continue }
              start := fset.Position(fn.Pos()).Offset
              end := fset.Position(fn.End()).Offset
              methods = append(methods, method{name: fn.Name.Name, text: string(src[start:end]), start:start, end:end})
            }
            if len(methods)==0 { panic("no Service methods found") }
            sort.Slice(methods, func(i,j int) bool { return methods[i].start < methods[j].start })
            var kept []byte; cursor := 0
            for _, m := range methods { kept = append(kept, src[cursor:m.start]...); cursor=m.end }
            kept = append(kept, src[cursor:]...)
            if err := os.WriteFile(filename, kept, 0644); err != nil { panic(err) }
            buckets := map[string][]string{
              "sessions.go":{"GetShellState","CreateSessionProfile","DeleteSessionProfile","LaunchSession","CloseSession"},
              "ssh.go":{"SSH","AcceptSSHHostKey"}, "sftp.go":{"SFTP"}, "rdp.go":{"RDP"},
              "ai.go":{"AI","Chat","Provider","Model","Native","Cloud","Vault","KeePass"},
              "audit.go":{"Audit","CommandPolicy"}, "settings.go":{"Settings","Credential"},
              "workspace.go":{"Workspace","RuntimeTab"},
            }
            out := map[string][]string{}
            for _, m := range methods {
              target := "misc.go"
              for file, prefixes := range buckets { for _, p := range prefixes { if m.name == p || strings.HasPrefix(m.name,p) { target=file; break } }; if _,ok:=out[target]; target!="misc.go" || ok { if target!="misc.go" { break } } }
              out[target] = append(out[target], m.text)
            }
            for file, ms := range out {
              if len(ms)==0 { continue }
              body := "package app\n\n" + strings.Join(ms, "\n\n") + "\n"
              if err := os.WriteFile(filepath.Join("internal/app",file), []byte(body), 0644); err != nil { panic(err) }
            }
            fmt.Printf("moved %d Service methods\n", len(methods))
          }
          GO
          go run /tmp/split_service.go
          gofmt -w internal/app/*.go
          go install golang.org/x/tools/cmd/goimports@latest
          "$(go env GOPATH)/bin/goimports" -w internal/app/*.go
          gofmt -w internal/app/*.go
          go test ./...
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app .github/workflows/_split_service.yml
          git rm .github/workflows/_split_service.yml
          git commit -m 'refactor: split application service by capability'
          git push