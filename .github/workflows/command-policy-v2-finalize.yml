name: Finalize command policy v2

on:
  push:
    branches: [feat/command-policy-v2]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-policy-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply finalization
        run: python scripts/command_policy_v2_finalize.py
      - name: Format and test
        run: |
          gofmt -w internal/app/service.go internal/app/command_policy_test.go
          go test ./internal/app
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go internal/app/command_policy_test.go scripts/command_policy_v2_finalize.py .github/workflows/command-policy-v2-finalize.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Implement exact command approval semantics'
          git push origin feat/command-policy-v2
