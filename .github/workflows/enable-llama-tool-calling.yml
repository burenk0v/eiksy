name: enable-llama-tool-calling

on:
  push:
    branches:
      - feat/ai-tool-calling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-tool-calling
          fetch-depth: 0
      - name: Add llama jinja mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/app/service.go')
          text = p.read_text()
          old = '\t\t"--host", localAIHost,\n\t\t"--port", localAIPort,\n'
          new = '\t\t"--host", localAIHost,\n\t\t"--port", localAIPort,\n\t\t"--jinja",\n'
          if old in text and '"--jinja"' not in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          rm -f .github/workflows/enable-llama-tool-calling.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go .github/workflows/enable-llama-tool-calling.yml
          git diff --cached --quiet || git commit -m 'feat: enable llama native tool calling'
          git push origin feat/ai-tool-calling
