name: Apply final AI SSH output fix

on:
  push:
    branches:
      - feat/ai-tool-calling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'burenk0v'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI SSH execution output
        shell: python
        run: |
          from pathlib import Path

          service = Path('internal/app/service.go')
          text = service.read_text()

          text = text.replace(
              '\tlocalAIPort            = "8012"\n',
              '\tlocalAIPort            = "8012"\n\tmaxAICommandOutput     = 32 * 1024\n',
              1,
          )
          text = text.replace(
              '\tAcceptHostKey(string) error\n',
              '\tAcceptHostKey(string) error\n\tExecCommand(string, string) (string, error)\n',
              1,
          )

          old = '''\t\tif err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q}`, err.Error()))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q}`, request.SessionID, request.Command))'''
          new = '''\t\toutput, err := s.executeSessionCommandWithOutput(request.SessionID, request.Command)\n\t\tif err != nil {\n\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, marshalNativeExecutionFailure(err, output))\n\t\t}\n\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, marshalNativeExecutionResult(request.SessionID, request.Command, output))'''
          if old not in text:
              raise SystemExit('pending native execution block not found')
          text = text.replace(old, new, 1)

          old = '''func (s *Service) executeSessionCommand(sessionID, command string) error {\n\tsessionID = strings.TrimSpace(sessionID)\n\tcommand = strings.TrimSpace(command)\n\tif sessionID == "" {\n\t\treturn fmt.Errorf("command request session id is required")\n\t}\n\tif command == "" {\n\t\treturn fmt.Errorf("command cannot be empty")\n\t}\n\ttab, ok := s.runtimeTab(sessionID)\n\tif !ok {\n\t\treturn fmt.Errorf("active session %q not found", sessionID)\n\t}\n\tif tab.ProtocolID != "ssh" {\n\t\treturn fmt.Errorf("commands can only run in ssh sessions")\n\t}\n\tif s.sshManager == nil {\n\t\treturn fmt.Errorf("ssh manager is not configured")\n\t}\n\treturn s.sshManager.SendInput(sessionID, command+"\\n")\n}'''
          new = '''func (s *Service) executeSessionCommand(sessionID, command string) error {\n\t_, err := s.executeSessionCommandWithOutput(sessionID, command)\n\treturn err\n}\n\nfunc (s *Service) executeSessionCommandWithOutput(sessionID, command string) (string, error) {\n\tsessionID = strings.TrimSpace(sessionID)\n\tcommand = strings.TrimSpace(command)\n\tif sessionID == "" {\n\t\treturn "", fmt.Errorf("command request session id is required")\n\t}\n\tif command == "" {\n\t\treturn "", fmt.Errorf("command cannot be empty")\n\t}\n\ttab, ok := s.runtimeTab(sessionID)\n\tif !ok {\n\t\treturn "", fmt.Errorf("active session %q not found", sessionID)\n\t}\n\tif tab.ProtocolID != "ssh" {\n\t\treturn "", fmt.Errorf("commands can only run in ssh sessions")\n\t}\n\tif s.sshManager == nil {\n\t\treturn "", fmt.Errorf("ssh manager is not configured")\n\t}\n\toutput, err := s.sshManager.ExecCommand(sessionID, command)\n\tif len(output) > maxAICommandOutput {\n\t\toutput = output[:maxAICommandOutput] + "\\n[output truncated by Eiksy]"\n\t}\n\treturn output, err\n}'''
          if old not in text:
              raise SystemExit('executeSessionCommand implementation not found')
          text = text.replace(old, new, 1)

          service.write_text(text)

          native = Path('internal/app/native_tool_calling.go')
          text = native.read_text()
          old = '''\tcase commandPolicyDecisionAllow:\n\t\tif err := s.executeSessionCommand(args.SessionID, args.Command); err != nil {\n\t\t\treturn fmt.Sprintf(`{"error":"command execution failed","message":%q}`, err.Error()), false, nil\n\t\t}\n\t\treturn fmt.Sprintf(`{"ok":true,"sessionId":%q,"command":%q}`, args.SessionID, args.Command), false, nil'''
          new = '''\tcase commandPolicyDecisionAllow:\n\t\toutput, err := s.executeSessionCommandWithOutput(args.SessionID, args.Command)\n\t\tif err != nil {\n\t\t\treturn marshalNativeExecutionFailure(err, output), false, nil\n\t\t}\n\t\treturn marshalNativeExecutionResult(args.SessionID, args.Command, output), false, nil'''
          if old not in text:
              raise SystemExit('native allow block not found')
          text = text.replace(old, new, 1)
          text += '''\n\nfunc marshalNativeExecutionResult(sessionID, command, output string) string {\n\tpayload := map[string]any{\n\t\t"ok":        true,\n\t\t"sessionId": sessionID,\n\t\t"command":   command,\n\t\t"output":    output,\n\t}\n\tencoded, _ := json.Marshal(payload)\n\treturn string(encoded)\n}\n\nfunc marshalNativeExecutionFailure(err error, output string) string {\n\tpayload := map[string]any{\n\t\t"error":   "command execution failed",\n\t\t"message": err.Error(),\n\t\t"output":  output,\n\t}\n\tencoded, _ := json.Marshal(payload)\n\treturn string(encoded)\n}\n'''
          native.write_text(text)

      - name: Format and test
        run: |
          gofmt -w internal/app/service.go internal/app/native_tool_calling.go internal/ssh/manager.go internal/app/ssh_command_output_test.go
          go test ./...

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go internal/app/native_tool_calling.go internal/ssh/manager.go internal/app/ssh_command_output_test.go .github/workflows/fix-ai-output-once.yml
          git commit -m 'fix(ai): return SSH output after approval' || exit 0
          git rm .github/workflows/fix-ai-output-once.yml
          git commit -m 'chore(ci): remove one-shot AI output patch workflow'
          git push
