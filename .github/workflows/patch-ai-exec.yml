name: Patch AI exec output

on:
  push:
    branches: [feat/ai-tool-calling]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('internal/app/service.go')
          text = p.read_text()
          marker = 'type sftpManager interface {'
          if 'type sshCommandExecutor interface' not in text:
              text = text.replace(marker, 'type sshCommandExecutor interface {\n\tExecCommand(string, string) (string, error)\n}\n\n' + marker, 1)
          old = 'func (s *Service) executeSessionCommand(sessionID, command string) error {'
          if old not in text:
              raise SystemExit('executeSessionCommand block not found')
          start = text.index(old)
          end = text.index('\n}\n', start) + 3
          new = '''func (s *Service) executeSessionCommand(sessionID, command string) (string, error) {
\tsessionID = strings.TrimSpace(sessionID)
\tcommand = strings.TrimSpace(command)
\tif sessionID == "" { return "", fmt.Errorf("command request session id is required") }
\tif command == "" { return "", fmt.Errorf("command cannot be empty") }
\ttab, ok := s.runtimeTab(sessionID)
\tif !ok { return "", fmt.Errorf("active session %q not found", sessionID) }
\tif tab.ProtocolID != "ssh" { return "", fmt.Errorf("commands can only run in ssh sessions") }
\tif s.sshManager == nil { return "", fmt.Errorf("ssh manager is not configured") }
\tif executor, ok := s.sshManager.(sshCommandExecutor); ok { return executor.ExecCommand(sessionID, command) }
\tif err := s.sshManager.SendInput(sessionID, command+"\\n"); err != nil { return "", err }
\treturn "", nil
}
'''
          text = text[:start] + new + text[end:]
          text = text.replace('if err := s.executeSessionCommand', 'if _, err := s.executeSessionCommand')
          p.write_text(text)

          p = Path('internal/ssh/manager.go')
          text = p.read_text()
          if 'func (m *Manager) ExecCommand(' not in text:
              marker = 'func (m *Manager) SendInput(tabID, data string) error {'
              method = '''func (m *Manager) ExecCommand(tabID, command string) (string, error) {
\tm.mu.RLock()
\tconn := m.connections[tabID]
\tm.mu.RUnlock()
\tif conn == nil { return "", fmt.Errorf("ssh tab %q is not connected", tabID) }
\tcommand = strings.TrimSpace(command)
\tif command == "" { return "", fmt.Errorf("command cannot be empty") }
\tsession, err := conn.client.NewSession()
\tif err != nil { return "", fmt.Errorf("create ssh exec session: %w", err) }
\tdefer session.Close()
\toutput, err := session.CombinedOutput(command)
\tresult := string(output)
\tconst maxToolOutput = 32768
\tif len(result) > maxToolOutput { result = result[:maxToolOutput] + "\\n[output truncated by Eiksy]" }
\tif err != nil { return result, fmt.Errorf("run command over ssh: %w", err) }
\treturn result, nil
}

'''
              text = text.replace(marker, method + marker, 1)
          p.write_text(text)

          p = Path('internal/app/native_tool_calling.go')
          text = p.read_text()
          old = '''if err := s.executeSessionCommand(args.SessionID, args.Command); err != nil {
\t\t\treturn fmt.Sprintf(`{"error":"command execution failed","message":%q}`, err.Error()), false, nil
\t\t}
\t\treturn fmt.Sprintf(`{"ok":true,"sessionId":%q,"command":%q}`, args.SessionID, args.Command), false, nil'''
          new = '''output, err := s.executeSessionCommand(args.SessionID, args.Command)
\t\tif err != nil {
\t\t\treturn fmt.Sprintf(`{"error":"command execution failed","message":%q,"output":%q}`, err.Error(), output), false, nil
\t\t}
\t\treturn fmt.Sprintf(`{"ok":true,"sessionId":%q,"command":%q,"output":%q}`, args.SessionID, args.Command, output), false, nil'''
          if old in text: text = text.replace(old, new, 1)
          old = '''if err := s.executeSessionCommand(request.SessionID, request.Command); err != nil {
\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q}`, err.Error()))
\t\t}
\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q}`, request.SessionID, request.Command))'''
          new = '''output, err := s.executeSessionCommand(request.SessionID, request.Command)
\t\tif err != nil {
\t\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"execution_failed","message":%q,"output":%q}`, err.Error(), output))
\t\t}
\t\treturn s.resumePendingNativeToolCall(s.resolveContext(context.Background()), pending, fmt.Sprintf(`{"status":"executed","sessionId":%q,"command":%q,"output":%q}`, request.SessionID, request.Command, output))'''
          if old in text: text = text.replace(old, new, 1)
          p.write_text(text)
      - name: Test
        run: |
          gofmt -w internal/app/service.go internal/app/native_tool_calling.go internal/ssh/manager.go
          go test ./...
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go internal/app/native_tool_calling.go internal/ssh/manager.go
          git rm .github/workflows/patch-ai-exec.yml
          git commit -m 'feat(ai): return SSH command output to tool calls'
          git push
