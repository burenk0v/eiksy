name: integrate-command-policy-v2
on:
  push:
    branches: [feat/command-policy-v2]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-policy-v2
          fetch-depth: 0
      - name: Integrate policy
        run: python3 scripts/integrate_command_policy.py
      - name: Format and test
        run: |
          gofmt -w internal/app/service.go
          git diff --check
          go test ./...
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go scripts/integrate_command_policy.py .github/workflows/apply-command-policy-v2-integration.yml
          git commit -m 'feat: enforce command-level policy during AI execution'
          git push origin HEAD:feat/command-policy-v2
