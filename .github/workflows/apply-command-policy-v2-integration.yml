name: integrate-command-policy-v2
on:
  push:
    branches: [feat/command-policy-v2]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-policy-v2
          fetch-depth: 0
      - name: Patch service
        env:
          EVALUATOR_B64:  mcyAqIiwgQWN0aW9uOiBhaS5Db21tYW5kUGVybWlzc2lvbkRlbnksIERlc2NyaXB0aW9uOiAiRm9ybWF0IGZpbGVzeXN0ZW0ifSwKCQl7VG9vbElEOiAic2hlbGwiLCBQYXR0ZXJuOiAiZGQgKiIsIEFjdGlvbjogYWkuQ29tbWFuZFBlcm1pc3Npb25EZW55LCBEZXNjcmlwdGlvbjogIlJhdyBkaXNrIG9wZXJhdGlvbiJ9LAoJfQp9Cg==
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('internal/app/service.go')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if 'else if allowed := commandAllowedByPolicy(' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + 'else if action := commandActionForRequest(state.CommandPolicy, commandRequest.ToolID, commandRequest.SessionID, commandRequest.Command); action == ai.CommandPermissionDeny {'
                  lines.insert(i + 1, indent + chr(9) + 'reply = fmt.Sprintf("Command denied by Command Policy: `%s`", commandRequest.Command)')
                  lines.insert(i + 2, indent + '} else if action == ai.CommandPermissionAllow {')
                  break
          else:
              raise SystemExit('SendChatMessage hook not found')
          for i, line in enumerate(lines):
              if 'if !commandToolEnabled(policy, request.ToolID)' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines.insert(i + 3, indent + 'if commandActionForRequest(policy, request.ToolID, request.SessionID, request.Command) == ai.CommandPermissionDeny {')
                  lines.insert(i + 4, indent + chr(9) + 'return fmt.Errorf("command is denied by Command Policy")')
                  lines.insert(i + 5, indent + '}')
                  break
          else:
              raise SystemExit('Resolve guard not found')
          marker = 'func commandAllowedByPolicy(policy ai.CommandPolicy, toolID, sessionID string) bool {'
          text = '\n'.join(lines) + '\n'
          if marker not in text:
              raise SystemExit('commandAllowedByPolicy marker not found')
          evaluator = base64.b64decode(__import__('os').environ['EVALUATOR_B64']).decode()
          text = text.replace(marker, evaluator + '\n' + marker, 1)
          p.write_text(text)
          PY
          gofmt -w internal/app/service.go
          git diff --check
          go test ./...
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/app/service.go
          git commit -m 'feat: enforce command-level policy during AI execution'
          git push origin HEAD:feat/command-policy-v2
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-command-policy-v2-integration.yml
          git commit -m 'chore: remove temporary integration workflow'
          git push origin HEAD:feat/command-policy-v2
